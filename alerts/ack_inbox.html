<title>알림 확인함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 한 줄 세로 목록: 위에 미확인 요약, 그 아래 확인 대기 카드, 맨 아래 처리 기록 */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #1c211d;
  --muted: #5f6a62;
  --line: #d9ddd6;
  --alert: #c2410c;
  --alert-soft: #fbeee6;
  --ok: #2f6f4e;
  --ok-soft: #e5f1ea;
  --btn-fg: #ffffff;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151916; --surface: #1d231f; --fg: #e8ece6; --muted: #9aa69d; --line: #333c36;
    --alert: #fb8a4c; --alert-soft: #3a2519; --ok: #7cc79f; --ok-soft: #1f3328; --btn-fg: #1a0f08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151916; --surface: #1d231f; --fg: #e8ece6; --muted: #9aa69d; --line: #333c36;
  --alert: #fb8a4c; --alert-soft: #3a2519; --ok: #7cc79f; --ok-soft: #1f3328; --btn-fg: #1a0f08;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
h1 .n { color: var(--alert); font-variant-numeric: tabular-nums; }
h1.clear .n { color: var(--ok); }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--alert); border-radius: 10px; padding: 14px 14px 14px 14px; display: grid; gap: 8px; min-width: 0; }
.src { font-size: 12px; color: var(--alert); font-weight: 700; }
.card h2 { margin: 0; font-size: 18px; line-height: 1.35; text-wrap: balance; overflow-wrap: anywhere; }
.msg { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
button.ack { appearance: none; border: 0; border-radius: 8px; background: var(--alert); color: var(--btn-fg); font: inherit; font-weight: 700; font-size: 16px; padding: 12px 18px; min-height: 48px; cursor: pointer; flex: 1 1 auto; }
button.ack:disabled { opacity: .6; cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
a.orig { color: var(--fg); font-weight: 500; text-underline-offset: 3px; }
.err { color: var(--alert); font-size: 13px; margin: 0; }
.empty { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 16px; font-weight: 500; }
.notice { background: var(--alert-soft); color: var(--fg); border-radius: 10px; padding: 14px 16px; }
h3 { margin: 8px 0 0; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.hist { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
.hrow:first-child { border-top: 0; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.acked { background: var(--ok-soft); color: var(--ok); }
.pill.expired { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.htitle { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.htime { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
button.undo { appearance: none; background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }
footer { color: var(--muted); font-size: 12px; line-height: 1.6; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">알림 확인함 · KST</div>
    <h1 id="headline">불러오는 중</h1>
    <p class="sub" id="subline">확인 버튼을 누르기 전까지 같은 알림이 다시 옵니다.</p>
  </header>

  <div id="notice" class="notice" hidden></div>
  <section class="list" id="pending" aria-live="polite"></section>

  <h3 id="histHead" hidden>처리 기록</h3>
  <section class="hist" id="history" hidden></section>

  <footer>
    확인하지 않은 알림은 매일 08:07 · 12:07 · 18:07 · 21:07에 다시 보냅니다. 알림마다 정해 둔 만료 시각이 지나면 더 보내지 않습니다.
    폰 알림을 밀어서 지우는 것은 확인으로 치지 않습니다.
  </footer>
</div>

<script>
(function () {
  const fmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  const t = (iso) => {
    if (!iso) return '–';
    const d = new Date(iso);
    if (isNaN(d)) return '–';
    const p = {}; for (const x of fmt.formatToParts(d)) p[x.type] = x.value;
    return p.month + '/' + p.day + ' ' + p.hour + ':' + p.minute;
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const $ = (id) => document.getElementById(id);

  let db = null;
  let docs = [];
  const busy = new Set();
  const errors = {};

  function isExpired(a) { return a.expires && new Date(a.expires).getTime() <= Date.now(); }

  function render() {
    const pending = docs.filter(d => d.data.status === 'pending' && !isExpired(d.data))
      .sort((a, b) => String(b.data.created || '').localeCompare(String(a.data.created || '')));
    const done = docs.filter(d => !(d.data.status === 'pending' && !isExpired(d.data)))
      .sort((a, b) => String(b.data.acked_at || b.data.expires || b.data.created || '').localeCompare(String(a.data.acked_at || a.data.expires || a.data.created || '')))
      .slice(0, 30);

    const h = $('headline');
    if (pending.length) {
      h.className = '';
      h.innerHTML = '';
      h.append('확인 안 한 알림 ', el('span', 'n', String(pending.length)), '건');
    } else {
      h.className = 'clear';
      h.innerHTML = '';
      h.append('모두 확인했습니다 ', el('span', 'n', '✓'));
    }

    const list = $('pending');
    list.replaceChildren();
    if (!pending.length) {
      list.append(el('div', 'empty', '지금 확인할 알림이 없습니다. 루틴이 새 알림을 보내면 여기에 나타납니다.'));
    }
    for (const d of pending) {
      const a = d.data;
      const card = el('article', 'card');
      if (a.source) card.append(el('div', 'src', a.source));
      card.append(el('h2', null, a.title || '(제목 없음)'));
      if (a.message) card.append(el('p', 'msg', a.message));
      const meta = el('div', 'meta');
      meta.append(el('span', null, '처음 ' + t(a.created)));
      meta.append(el('span', null, (a.sent_count || 1) + '번 보냄'));
      if (a.last_sent) meta.append(el('span', null, '마지막 ' + t(a.last_sent)));
      if (a.expires) meta.append(el('span', null, '만료 ' + t(a.expires)));
      card.append(meta);
      const row = el('div', 'row');
      const btn = el('button', 'ack', busy.has(d.id) ? '저장 중…' : '확인했어요');
      btn.type = 'button';
      btn.id = 'ack-' + d.id;
      btn.disabled = busy.has(d.id) || !db;
      btn.addEventListener('click', () => ack(d.id));
      row.append(btn);
      if (a.click && /^https:\/\//.test(a.click)) {
        const link = el('a', 'orig', '원래 페이지 열기 ↗');
        link.href = a.click; link.target = '_blank'; link.rel = 'noopener';
        row.append(link);
      }
      card.append(row);
      if (errors[d.id]) card.append(el('p', 'err', errors[d.id]));
      list.append(card);
    }

    const hist = $('history');
    hist.replaceChildren();
    $('histHead').hidden = hist.hidden = done.length === 0;
    for (const d of done) {
      const a = d.data;
      const acked = a.status === 'acked';
      const r = el('div', 'hrow');
      r.append(el('span', 'pill ' + (acked ? 'acked' : 'expired'), acked ? '확인' : '만료'));
      r.append(el('span', 'htitle', a.title || d.id));
      const right = el('span', 'htime', acked ? t(a.acked_at) : t(a.expires));
      if (acked && !isExpired(a)) {
        const u = el('button', 'undo', '되돌리기');
        u.type = 'button';
        u.id = 'undo-' + d.id;
        u.addEventListener('click', () => undo(d.id));
        right.append(' ', u);
      }
      r.append(right);
      hist.append(r);
    }
  }

  async function write(id, body) {
    busy.add(id); delete errors[id]; render();
    try {
      await db.doc('alerts/' + id).update(body);
    } catch (e) {
      errors[id] = (e && e.code === 'invalid_argument')
        ? '이 계정으로는 저장할 수 없습니다. 알림을 만든 계정으로 로그인해 여세요.'
        : '저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.';
    } finally {
      busy.delete(id); render();
    }
  }
  function ack(id) { return write(id, { status: 'acked', acked_at: new Date().toISOString(), acked_via: 'page' }); }
  function undo(id) { return write(id, { status: 'pending', acked_at: null, acked_via: null }); }

  render();
  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) {
      $('headline').textContent = '저장소에 연결하지 못했습니다';
      const n = $('notice'); n.hidden = false;
      n.textContent = 'claude.ai에 로그인한 상태로 이 페이지를 다시 여세요. 연결되기 전에는 확인 버튼이 저장되지 않습니다.';
      return;
    }
    db.collection('alerts').limit(300).onSnapshot((snap) => {
      docs = snap.docs.filter(s => s.exists).map(s => ({ id: s.id, data: s.data() || {} }));
      render();
    }, () => {
      const n = $('notice'); n.hidden = false;
      n.textContent = '목록을 불러오지 못했습니다. 페이지를 새로 고치세요.';
    });
  })();
})();
</script>
